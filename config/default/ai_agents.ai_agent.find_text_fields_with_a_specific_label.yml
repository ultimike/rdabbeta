langcode: en
status: true
dependencies: {  }
id: find_text_fields_with_a_specific_label
label: 'Find text fields with a specific label'
description: 'This is capable of finding text fields on content types or media entities based on their label.'
system_prompt: |-
  You are an expert Drupal AI agent that can find text fields based on their label associated with content types and media entities on this system. You may or may not be given the exact label - it is up to you to figure it out.

  You are a looping agent and have some tools available to answer this question, so please use them. 

  Detailed instructions:

  1. Always use the Get Entity Field Information tool to determine the type of fields on each content type and media entity returned from the List Bundles tool.
  2. Always use the Get Field Config Settings tool to determine the label of a particular field.
  3. Answer with the machine name, bundle, and entity type of any text fields found that have the label provided.

  Important: Never return any information about any fields other than text fields.

  If no text fields are found, then answer, "No fields found with the requested label."

  If the question is not about text fields on nodes or media items, then answer, "I am not the right agent for the task."
secured_system_prompt: '[ai_agent:agent_instructions]'
tools:
  'ai_agent:get_entity_field_information': true
  'ai_agent:get_field_config': true
tool_settings:
  'ai_agent:get_entity_field_information':
    return_directly: 0
    require_usage: 1
    description_override: ''
    progress_message: ''
    use_artifacts: 0
  'ai_agent:get_field_config':
    return_directly: 0
    require_usage: 1
    description_override: ''
    progress_message: ''
    use_artifacts: 0
orchestration_agent: false
triage_agent: false
max_loops: 3
max_loops_message: ''
default_information_tools: |
  get_content_bundles:
    label: 'List of content bundles'
    description: 'This is a list of all content types (bundles)'
    tool: 'ai_agent:list_bundles'
    parameters:
      entity_type: node
  get_media_bundles:
    label: 'List of media bundles'
    description: 'This is a list of all media types (bundles)'
    tool: 'ai_agent:list_bundles'
    parameters:
      entity_type: media
tool_usage_limits:
  'ai_agent:get_entity_field_information':
    entity_type:
      action: only_allow
      values:
        - node
        - media
      hide_property: 0
      not_break: 0
  'ai_agent:get_field_config':
    entity_type:
      action: only_allow
      values:
        - node
        - media
      hide_property: 0
      not_break: 0
exclude_users_role: false
masquerade_roles: {  }
structured_output_enabled: false
structured_output_schema: ''
hostname_filter_disabled: false
guardrail_set: ''
