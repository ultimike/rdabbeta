data: '{"id":"eca_extract_address","version":"1.0.0","metadata":{"label":"ECA: Extract address","documentation":"","executable":true,"tags":[],"changelog":"","id":"eca_extract_address","version":"1.0.0","template":false,"storage":""},"nodes":[{"id":"eca_field_widget_nwqp4htq","componentType":1,"plugin":"eca_field_widget_actions:eca_field_widget","label":"Find address in body","position":{"x":400,"y":100},"configuration":{},"annotation":""},{"id":"entity_get_field_value_ioetif9z","componentType":4,"plugin":"eca_get_field_value","label":"Get body field text","position":{"x":402,"y":308},"configuration":{"object":"entity","field_name":"field_body","token_name":"body"},"annotation":""},{"id":"chat_796tlnmv","componentType":4,"plugin":"ai_integration_eca_execute_chat","label":"Chat","position":{"x":404,"y":516},"configuration":{"model":"amazeeio__claude-5-sonnet","token_input":"","token_result":"location-from-body","prompt":"Analyze the entire text and identify ALL locations mentioned, including businesses, addresses, landmarks, neighborhoods, cities, regions, and countries.\n\nFrom all locations found, select the single MOST PRECISE and SPECIFIC location. Prefer in this order:\n1. A full street address (e.g. \"123 Main St, Springfield, IL\")\n2. A named business or landmark with a city/region (e.g. \"Louie''s Pizzeria, Queens, New York\")\n3. A named business or landmark alone (e.g. \"Eiffel Tower\")\n4. A neighborhood or district with city (e.g. \"SoHo, Manhattan\")\n5. A city with state/country (e.g. \"Melbourne, Florida\")\n6. A city alone\n7. A region, state, or country\n\nIf a less precise location provides context for a more precise one, combine them into a single query (e.g. if the text mentions \"Lombard Street\" and \"San Francisco\" separately, return \"Lombard Street, San Francisco\").\n\nReturn ONLY the clean, searchable location query string with no additional text, labels, or explanation.\n\nHere is the text:\n============\n[body]\n============\n"},"annotation":""},{"id":"geocode_location_via_geoapify_8xzbyyz2","componentType":4,"plugin":"drupaleasy_ai_tools_geoapify_geocode","label":"Geocode location via Geoapify","position":{"x":406,"y":724},"configuration":{"output_key":"geoapify_geocode","api_key":"6a4a1fc38fec437bb700143517927f31","input_key":"[location-from-body]"},"annotation":""},{"id":"set_address_field_widget_value_wt2s4b8a","componentType":4,"plugin":"drupaleasy_ai_tools_set_address_widget_value","label":"Set Address field widget value","position":{"x":408,"y":932},"configuration":{"country_code":"[geoapify_geocode:country_code]","address_line1":"[geoapify_geocode:street]","address_line2":"","locality":"[geoapify_geocode:city]","administrative_area":"[geoapify_geocode:state_code]","postal_code":"[geoapify_geocode:postcode]","organization":"[geoapify_geocode:name]"},"annotation":""}],"edges":[{"id":"eca_field_widget_nwqp4htq_to_entity_get_field_value_ioetif9z_fj4578ft","source":"eca_field_widget_nwqp4htq","target":"entity_get_field_value_ioetif9z","condition":"","conditionId":"","conditionLabel":"","conditionConfiguration":{},"annotation":"","controlOffset":{"x":0,"y":0}},{"id":"entity_get_field_value_ioetif9z_to_chat_796tlnmv_4mubmfxt","source":"entity_get_field_value_ioetif9z","target":"chat_796tlnmv","condition":"","conditionId":"","conditionLabel":"","conditionConfiguration":{},"annotation":"","controlOffset":{"x":0,"y":0}},{"id":"chat_796tlnmv_to_geocode_location_via_geoapify_8xzbyyz2_p9815flt","source":"chat_796tlnmv","target":"geocode_location_via_geoapify_8xzbyyz2","condition":"","conditionId":"","conditionLabel":"","conditionConfiguration":{},"annotation":"","controlOffset":{"x":0,"y":0}},{"id":"geocode_location_via_geoapify_8xzbyyz2_to_set_address_field_widget_value_wt2s4b8a_gecxli7f","source":"geocode_location_via_geoapify_8xzbyyz2","target":"set_address_field_widget_value_wt2s4b8a","condition":"","conditionId":"","conditionLabel":"","conditionConfiguration":{},"annotation":"","controlOffset":{"x