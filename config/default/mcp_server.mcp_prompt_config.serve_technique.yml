id: serve_technique
label: 'Tennis Serve Technique Analyzer'
title: 'Analyze serve technique from demonstration'
description: 'Analyzes tennis serve technique using a reference image'
arguments:
  -
    label: 'Player Name'
    machine_name: player_name
    description: 'Name of the player being analyzed'
    required: false
messages:
  -
    role: user
    content:
      -
        type: text
        text: 'Analyze this tennis serve technique. Identify key points about grip, ball toss, racket position, and follow-through.'
      -
        type: image
        data: 
        mimeType: image/jpeg
  -
    role: assistant
    content:
      -
        type: text
        text: |-
          I'll analyze the serve technique shown in this image. Looking at the key elements:

          1. **Grip**: The continental grip appears to be used, which is ideal for serves
          2. **Ball Toss**: The toss position is slightly in front and to the right (for right-handers)
          3. **Racket Position**: The trophy position is well-formed with good shoulder rotation
          4. **Follow-through**: Full extension with proper weight transfer

          Key recommendations:
          - Maintain consistent toss height
          - Focus on pronation at contact point
          - Ensure full hip and shoulder rotation