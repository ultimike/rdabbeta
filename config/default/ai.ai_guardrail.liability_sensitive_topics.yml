id: liability_sensitive_topics
label: 'Liability: Sensitive Topics'
description: 'Detects socially divisive or politically charged subjects where any AI response carries reputational risk for the site owner. Suitable as a default block for any public-facing deployment.'
guardrail: restrict_to_topic
guardrail_settings:
  valid_topics: ''
  invalid_topics: |-
    politics
    political parties
    elections
    race (where "race" is a categorization of humans based on shared physical or social qualities into groups generally viewed as distinct within a given society.)
    racism
    religion
    war
    armed conflict
    ethnicity
    immigration
    abortion
    gun control
    capital punishment
    euthanasia
    terrorism
    genocide
    sexual orientation
    gender identity
    drug legalisation
    extremism
    human trafficking
  scan_all_user_messages: false
