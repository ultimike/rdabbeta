id: pii_phone_number
label: 'PII: Phone Number'
description: 'Detects international and US phone numbers in text. Covers formats using international dialing prefixes.'
guardrail: regexp_guardrail
guardrail_settings:
  regexp_pattern: '/(?<!\w)(?:(?:\+|0|00)[1-9][0-9\s().-]{6,20}\d|\(?[2-9]\d{2}\)?[-.\s]?[2-9]\d{2}[-.\s]?\d{4})(?!\w)/'
